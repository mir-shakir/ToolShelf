<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDE 2 Prep Tracker</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1b2e;
  --bg-secondary: #232540;
  --bg-tertiary: #2a2d4a;
  --bg-hover: #32355a;
  --text-primary: #e2e4f0;
  --text-secondary: #a0a3bd;
  --text-muted: #6b6f8a;
  --border: #3a3d5c;
  --accent: #6c63ff;
  --accent-hover: #5a52d5;
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.12);
  --orange: #fb923c;
  --orange-bg: rgba(251,146,60,0.12);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.12);
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.12);
  --cyan: #22d3ee;
  --cyan-bg: rgba(34,211,238,0.12);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}

header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top { display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
.header-sub { font-size: 0.8rem; color: var(--text-muted); }

.stats-bar { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.stat {
  font-size: 0.85rem;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}
.stat-done { color: var(--green); background: var(--green-bg); }
.stat-revisit { color: var(--amber); background: var(--amber-bg); }

.main-layout {
  display: flex;
  height: calc(100vh - 90px);
}

.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.filter-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.filter-section input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 0.85rem;
  outline: none;
}
.filter-section input[type="text"]:focus { border-color: var(--accent); }

.multi-select { position: relative; }
.multi-select-btn {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.multi-select-btn:hover { border-color: var(--accent); }
.multi-select-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 50;
  margin-top: 4px;
}
.multi-select-dropdown.open { display: block; }
.multi-select-dropdown label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  color: var(--text-secondary);
}
.multi-select-dropdown label:hover { background: var(--bg-hover); }
.multi-select-search {
  width: 100%;
  padding: 6px 10px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 0.8rem;
  outline: none;
}

.checkbox-group { display: flex; flex-direction: column; gap: 4px; }
.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  cursor: pointer;
}
.checkbox-group label:hover { color: var(--text-primary); }

.btn {
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-clear { width: 100%; }
.import-export { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.btn-export { width: 100%; }
.btn-import { width: 100%; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
}

.active-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
  min-height: 0;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: var(--accent);
  color: white;
  border-radius: 12px;
  font-size: 0.75rem;
  cursor: pointer;
}
.filter-chip:hover { opacity: 0.8; }
.filter-chip .chip-x { font-weight: bold; }

.problem-table { width: 100%; border-collapse: collapse; }
.problem-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-primary);
  cursor: pointer;
  user-select: none;
}
.problem-table th:hover { color: var(--text-primary); }
.sort-arrow { font-size: 0.7rem; }
.problem-table td {
  padding: 8px 12px;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
.problem-table tr.data-row { cursor: pointer; }
.problem-table tr.data-row:hover { background: var(--bg-hover); }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: 500;
}
.pill-light { background: var(--green-bg); color: var(--green); }
.pill-full-focus { background: var(--red-bg); color: var(--red); }
.pill-both { background: var(--orange-bg); color: var(--orange); }

.pillar-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 500;
  background: var(--cyan-bg);
  color: var(--cyan);
  white-space: nowrap;
}

.status-icon { font-size: 1rem; }
.status-done { color: var(--green); }
.status-revisit { color: var(--amber); }
.status-none { color: var(--text-muted); }

.detail-panel { background: var(--bg-secondary); border-bottom: 2px solid var(--accent); }
.detail-panel td { padding: 16px 20px; }
.detail-content { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.detail-meta { display: flex; flex-direction: column; gap: 8px; }
.detail-meta-item { font-size: 0.8rem; color: var(--text-secondary); }
.detail-meta-item strong { color: var(--text-primary); }
.detail-tip {
  margin-top: 8px;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-style: italic;
}
.detail-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.detail-actions .btn { padding: 6px 16px; }
.btn-done { border-color: var(--green); color: var(--green); }
.btn-done:hover, .btn-done.active { background: var(--green-bg); }
.btn-revisit { border-color: var(--amber); color: var(--amber); }
.btn-revisit:hover, .btn-revisit.active { background: var(--amber-bg); }
.btn-visit { border-color: var(--cyan); color: var(--cyan); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn-visit:hover { background: var(--cyan-bg); }
.detail-note { margin-top: 12px; }
.detail-note textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 0.85rem;
  font-family: inherit;
  resize: vertical;
  outline: none;
}
.detail-note textarea:focus { border-color: var(--accent); }

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
  margin-top: 16px;
  padding: 12px 0;
}
.page-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.8rem;
}
.page-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; height: auto; }
  .sidebar {
    width: 100%; min-width: 100%;
    border-right: none; border-bottom: 1px solid var(--border);
    max-height: none; flex-direction: row; flex-wrap: wrap;
    padding: 12px; gap: 8px;
  }
  .filter-section { flex: 1; min-width: 140px; }
  .import-export { flex-direction: row; margin-top: 0; }
  .content { padding: 12px; }
  .problem-table th:nth-child(4), .problem-table td:nth-child(4) { display: none; }
  .detail-content { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

<header id="header">
  <div class="header-top">
    <h1>SDE 2 Prep Tracker</h1>
    <span class="header-sub">Java-focused &middot; Backend &amp; Distributed Systems</span>
  </div>
  <div class="stats-bar" id="stats-bar">
    <span class="stat" id="stat-total">Total: 0</span>
    <span class="stat stat-done" id="stat-done">Done: 0</span>
    <span class="stat stat-revisit" id="stat-revisit">Revisit: 0</span>
    <span class="stat" id="stat-remaining">Remaining: 0</span>
  </div>
</header>

<div class="main-layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-section">
      <label class="filter-label">Search</label>
      <input type="text" id="search-input" placeholder="Topic name..." autocomplete="off">
    </div>

    <div class="filter-section">
      <label class="filter-label">Pillar</label>
      <div class="multi-select" id="pillar-filter" data-filter="pillar"></div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Section</label>
      <div class="multi-select" id="section-filter" data-filter="section"></div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Context</label>
      <div class="checkbox-group" id="context-filter">
        <label><input type="checkbox" value="Light"> Light</label>
        <label><input type="checkbox" value="Full-Focus"> Full-Focus</label>
        <label><input type="checkbox" value="Both"> Both</label>
      </div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Status</label>
      <div class="checkbox-group" id="status-filter">
        <label><input type="checkbox" value="none"> None</label>
        <label><input type="checkbox" value="done"> Done</label>
        <label><input type="checkbox" value="revisit"> Revisit</label>
      </div>
    </div>

    <button class="btn btn-clear" id="clear-filters">Clear All Filters</button>

    <div class="filter-section import-export">
      <button class="btn btn-export" id="export-btn">Export Progress</button>
      <button class="btn btn-import" id="import-btn">Import Progress</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </aside>

  <main class="content">
    <div class="active-filters" id="active-filters"></div>
    <table class="problem-table" id="problem-table">
      <thead>
        <tr>
          <th class="sortable" data-sort="id"># <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="name">Topic <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="pillar">Pillar <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="category">Category <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="context">Context <span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="status">Status <span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

const ALL_SECTIONS = [...new Set(TOPICS.map(t => t.section))];

// ===== State =====
let state = {
  topics: TOPICS,
  progress: {},
  filtered: [],
  page: 1,
  pageSize: 50,
  sort: { key: "id", dir: "asc" },
  filters: {
    search: "",
    pillars: [],
    sections: [],
    context: [],
    status: [],
  },
  expandedId: null,
};

// ===== localStorage =====
const STORAGE_KEY = "sde2-prep-progress";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.progress = JSON.parse(raw);
  } catch (e) { console.warn("Failed to load progress:", e); }
}

function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); }
  catch (e) { console.warn("Failed to save progress:", e); }
}

function getStatus(id) {
  const p = state.progress[String(id)];
  return p ? p.status : "none";
}

function getNote(id) {
  const p = state.progress[String(id)];
  return p ? p.note || "" : "";
}

function setStatus(id, status) {
  const key = String(id);
  if (status === "none") {
    if (state.progress[key]) {
      if (state.progress[key].note) {
        state.progress[key].status = "none";
        state.progress[key].updatedAt = new Date().toISOString();
      } else {
        delete state.progress[key];
      }
    }
  } else {
    if (!state.progress[key]) state.progress[key] = {};
    state.progress[key].status = status;
    state.progress[key].updatedAt = new Date().toISOString();
  }
  saveProgress();
}

function setNote(id, note) {
  const key = String(id);
  if (!state.progress[key]) state.progress[key] = { status: "none" };
  state.progress[key].note = note;
  state.progress[key].updatedAt = new Date().toISOString();
  saveProgress();
}

// ===== Filtering =====
function applyFilters() {
  let results = state.topics;
  const f = state.filters;

  if (f.search) {
    const q = f.search.toLowerCase();
    results = results.filter(t => t.name.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.section.toLowerCase().includes(q));
  }
  if (f.pillars.length > 0) {
    results = results.filter(t => f.pillars.includes(t.pillar));
  }
  if (f.sections.length > 0) {
    results = results.filter(t => f.sections.includes(t.section));
  }
  if (f.context.length > 0) {
    results = results.filter(t => f.context.includes(t.context));
  }
  if (f.status.length > 0) {
    results = results.filter(t => f.status.includes(getStatus(t.id)));
  }

  const { key, dir } = state.sort;
  results.sort((a, b) => {
    let va, vb;
    if (key === "status") {
      const order = { done: 0, revisit: 1, none: 2 };
      va = order[getStatus(a.id)] ?? 2;
      vb = order[getStatus(b.id)] ?? 2;
    } else if (key === "context") {
      const order = { "Full-Focus": 0, "Both": 1, "Light": 2 };
      va = order[a.context] ?? 1;
      vb = order[b.context] ?? 1;
    } else {
      va = a[key]; vb = b[key];
    }
    if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return dir === "asc" ? -1 : 1;
    if (va > vb) return dir === "asc" ? 1 : -1;
    return 0;
  });

  state.filtered = results;
  state.page = 1;
  render();
}

// ===== Rendering =====
function render() {
  renderStats();
  renderTable();
  renderPagination();
  renderActiveFilters();
}

function renderStats() {
  const list = state.filtered;
  let done = 0, revisit = 0;
  list.forEach(t => {
    const s = getStatus(t.id);
    if (s === "done") done++;
    else if (s === "revisit") revisit++;
  });
  document.getElementById("stat-total").textContent = "Total: " + list.length;
  document.getElementById("stat-done").textContent = "Done: " + done;
  document.getElementById("stat-revisit").textContent = "Revisit: " + revisit;
  document.getElementById("stat-remaining").textContent = "Remaining: " + (list.length - done - revisit);
}

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderTable() {
  const tbody = document.getElementById("table-body");
  const start = (state.page - 1) * state.pageSize;
  const pageItems = state.filtered.slice(start, start + state.pageSize);

  let html = "";
  for (const t of pageItems) {
    const status = getStatus(t.id);
    const ctxClass = t.context.toLowerCase().replace("-", "-");
    const statusIcon = status === "done"
      ? '<span class="status-icon status-done">&#10003;</span>'
      : status === "revisit"
        ? '<span class="status-icon status-revisit">&#8635;</span>'
        : '<span class="status-icon status-none">&#9675;</span>';

    html += '<tr class="data-row" data-id="' + t.id + '">';
    html += "<td>" + t.id + "</td>";
    html += "<td>" + escapeHtml(t.name) + "</td>";
    html += '<td><span class="pillar-tag">' + escapeHtml(t.pillar) + "</span></td>";
    html += "<td>" + escapeHtml(t.category) + "</td>";
    html += '<td><span class="pill pill-' + (t.context === "Full-Focus" ? "full-focus" : t.context === "Light" ? "light" : "both") + '">' + t.context + "</span></td>";
    html += "<td>" + statusIcon + "</td>";
    html += "</tr>";

    if (state.expandedId === t.id) {
      html += renderDetailRow(t);
    }
  }
  tbody.innerHTML = html;
}

function getPillarPage(pillar) {
  const map = {
    "Java & JVM": "java-jvm.html",
    "Spring Boot": "spring-boot.html",
    "Databases": "databases.html",
    "Distributed Systems": "distributed-systems.html",
    "HLD": "hld.html",
    "LLD": "lld.html",
    "Observability": "observability.html",
    "Networking & APIs": "networking-apis.html",
    "Security": "security.html",
    "Behavioural": "behavioural.html"
  };
  return map[pillar] || "#";
}

function renderDetailRow(t) {
  const status = getStatus(t.id);
  const note = escapeHtml(getNote(t.id));
  const tipHtml = t.tip ? '<div class="detail-tip">' + escapeHtml(t.tip) + '</div>' : '';

  return '<tr class="detail-panel"><td colspan="6"><div class="detail-content">'
    + '<div class="detail-meta">'
    + '<div class="detail-meta-item"><strong>Section:</strong> ' + escapeHtml(t.section) + '</div>'
    + '<div class="detail-meta-item"><strong>Category:</strong> ' + escapeHtml(t.category) + '</div>'
    + '<div class="detail-meta-item"><strong>Pillar:</strong> ' + escapeHtml(t.pillar) + '</div>'
    + '<div class="detail-meta-item"><strong>Context:</strong> ' + escapeHtml(t.context) + '</div>'
    + tipHtml
    + '</div>'
    + '<div class="detail-right">'
    + '<div class="detail-actions">'
    + '<button class="btn btn-done' + (status === "done" ? " active" : "") + '" onclick="onSetStatus(' + t.id + ',\'done\')">Done</button>'
    + '<button class="btn btn-revisit' + (status === "revisit" ? " active" : "") + '" onclick="onSetStatus(' + t.id + ',\'revisit\')">Revisit</button>'
    + '<button class="btn" onclick="onSetStatus(' + t.id + ',\'none\')">Clear</button>'
    + '<a class="btn btn-visit" href="' + getPillarPage(t.pillar) + '#topic-' + t.id + '">Visit Details &#8599;</a>'
    + '</div>'
    + '<div class="detail-note">'
    + '<textarea placeholder="Add notes..." oninput="onNoteInput(' + t.id + ', this.value)">' + note + '</textarea>'
    + '</div></div></div></td></tr>';
}

function renderPagination() {
  const total = Math.ceil(state.filtered.length / state.pageSize);
  const container = document.getElementById("pagination");
  if (total <= 1) { container.innerHTML = ""; return; }

  let html = '<button class="page-btn" onclick="goPage(' + (state.page - 1) + ')" ' + (state.page === 1 ? "disabled" : "") + '>&laquo;</button>';
  const range = getPageRange(state.page, total);
  for (const p of range) {
    if (p === "...") {
      html += '<span class="page-btn" style="border:none;cursor:default;">...</span>';
    } else {
      html += '<button class="page-btn' + (p === state.page ? " active" : "") + '" onclick="goPage(' + p + ')">' + p + '</button>';
    }
  }
  html += '<button class="page-btn" onclick="goPage(' + (state.page + 1) + ')" ' + (state.page === total ? "disabled" : "") + '>&raquo;</button>';
  container.innerHTML = html;
}

function getPageRange(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const pages = [1];
  if (current > 3) pages.push("...");
  for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
  if (current < total - 2) pages.push("...");
  pages.push(total);
  return pages;
}

function renderActiveFilters() {
  const container = document.getElementById("active-filters");
  let html = "";
  const f = state.filters;
  f.pillars.forEach(t => { html += makeChip("pillar", t); });
  f.sections.forEach(t => { html += makeChip("section", t); });
  f.context.forEach(t => { html += makeChip("context", t); });
  f.status.forEach(t => { html += makeChip("status", t); });
  if (f.search) { html += makeChip("search", f.search); }
  container.innerHTML = html;
}

function makeChip(type, value) {
  const safeValue = escapeHtml(value).replace(/'/g, "&#39;");
  return '<span class="filter-chip" onclick="removeFilter(\'' + type + '\',\'' + safeValue + '\')">'
    + escapeHtml(value) + ' <span class="chip-x">&times;</span></span>';
}

// ===== Event Handlers =====
function goPage(n) {
  const total = Math.ceil(state.filtered.length / state.pageSize);
  if (n < 1 || n > total) return;
  state.page = n;
  state.expandedId = null;
  renderTable();
  renderPagination();
  document.querySelector(".content").scrollTop = 0;
}

function onSetStatus(id, status) {
  const current = getStatus(id);
  if (current === status) setStatus(id, "none");
  else setStatus(id, status);
  renderTable();
  renderStats();
}

let noteDebounce = null;
function onNoteInput(id, value) {
  clearTimeout(noteDebounce);
  noteDebounce = setTimeout(() => setNote(id, value), 500);
}

function removeFilter(type, value) {
  const decoded = value.replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  if (type === "search") {
    state.filters.search = "";
    document.getElementById("search-input").value = "";
  } else if (type === "pillar") {
    state.filters.pillars = state.filters.pillars.filter(t => t !== decoded);
    refreshMultiSelect("pillar-filter");
  } else if (type === "section") {
    state.filters.sections = state.filters.sections.filter(t => t !== decoded);
    refreshMultiSelect("section-filter");
  } else if (type === "context") {
    state.filters.context = state.filters.context.filter(t => t !== decoded);
    refreshCheckboxGroup("context-filter", state.filters.context);
  } else if (type === "status") {
    state.filters.status = state.filters.status.filter(t => t !== decoded);
    refreshCheckboxGroup("status-filter", state.filters.status);
  }
  applyFilters();
}

function refreshCheckboxGroup(containerId, activeValues) {
  document.getElementById(containerId).querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.checked = activeValues.includes(cb.value);
  });
}

// ===== Multi-select dropdowns =====
function initMultiSelect(containerId, items, filterKey) {
  const container = document.getElementById(containerId);
  const counts = {};
  items.forEach(item => { counts[item] = 0; });
  state.topics.forEach(t => {
    if (filterKey === "pillar") {
      if (counts[t.pillar] !== undefined) counts[t.pillar]++;
    } else if (filterKey === "section") {
      if (counts[t.section] !== undefined) counts[t.section]++;
    }
  });

  const btn = document.createElement("button");
  btn.className = "multi-select-btn";
  btn.innerHTML = 'Select... <span>&#9662;</span>';

  const dropdown = document.createElement("div");
  dropdown.className = "multi-select-dropdown";

  const searchInput = document.createElement("input");
  searchInput.className = "multi-select-search";
  searchInput.placeholder = "Search...";
  searchInput.type = "text";
  dropdown.appendChild(searchInput);

  const optionsDiv = document.createElement("div");
  items.forEach(item => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = item;
    cb.addEventListener("change", () => {
      const arr = filterKey === "pillar" ? "pillars" : "sections";
      if (cb.checked) state.filters[arr].push(item);
      else state.filters[arr] = state.filters[arr].filter(t => t !== item);
      updateBtnText();
      applyFilters();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(" " + item + " (" + (counts[item] || 0) + ")"));
    optionsDiv.appendChild(label);
  });
  dropdown.appendChild(optionsDiv);

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.toLowerCase();
    optionsDiv.querySelectorAll("label").forEach(label => {
      label.style.display = label.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });
  searchInput.addEventListener("click", e => e.stopPropagation());

  function updateBtnText() {
    const selected = filterKey === "pillar" ? state.filters.pillars : state.filters.sections;
    btn.innerHTML = selected.length === 0
      ? 'Select... <span>&#9662;</span>'
      : selected.length + ' selected <span>&#9662;</span>';
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".multi-select-dropdown.open").forEach(d => {
      if (d !== dropdown) d.classList.remove("open");
    });
    dropdown.classList.toggle("open");
  });

  container.appendChild(btn);
  container.appendChild(dropdown);

  container._refresh = function() {
    const selected = filterKey === "pillar" ? state.filters.pillars : state.filters.sections;
    optionsDiv.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.checked = selected.includes(cb.value);
    });
    updateBtnText();
  };
}

function refreshMultiSelect(containerId) {
  const container = document.getElementById(containerId);
  if (container._refresh) container._refresh();
}

// ===== Sorting =====
function initSorting() {
  document.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (state.sort.key === key) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
      else { state.sort.key = key; state.sort.dir = "asc"; }
      document.querySelectorAll(".sort-arrow").forEach(s => s.textContent = "");
      th.querySelector(".sort-arrow").textContent = state.sort.dir === "asc" ? " \u25B2" : " \u25BC";
      applyFilters();
    });
  });
}

// ===== Row expansion =====
function initTableClicks() {
  document.getElementById("table-body").addEventListener("click", (e) => {
    if (e.target.closest("button") || e.target.closest("a") || e.target.closest("textarea")) return;
    const row = e.target.closest("tr.data-row");
    if (!row) return;
    const id = parseInt(row.dataset.id);
    state.expandedId = state.expandedId === id ? null : id;
    renderTable();
  });
}

// ===== Checkbox filters =====
function initCheckboxFilters() {
  ["context-filter", "status-filter"].forEach(containerId => {
    document.getElementById(containerId).addEventListener("change", () => {
      const checked = Array.from(document.getElementById(containerId).querySelectorAll("input:checked")).map(cb => cb.value);
      if (containerId === "context-filter") state.filters.context = checked;
      else state.filters.status = checked;
      applyFilters();
    });
  });
}

// ===== Search =====
function initSearch() {
  let debounce = null;
  document.getElementById("search-input").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.filters.search = e.target.value.trim();
      applyFilters();
    }, 300);
  });
}

// ===== Import / Export =====
function initImportExport() {
  document.getElementById("export-btn").addEventListener("click", () => {
    const json = JSON.stringify(state.progress, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "sde2-prep-progress-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById("import-file");
  document.getElementById("import-btn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        const count = Object.keys(imported).length;
        if (!confirm("This will import " + count + " topic statuses. Conflicts will be overwritten. Continue?")) return;
        Object.assign(state.progress, imported);
        saveProgress();
        applyFilters();
      } catch (err) {
        alert("Invalid JSON file: " + err.message);
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });
}

// ===== Close dropdowns on outside click =====
function initClickOutside() {
  document.addEventListener("click", () => {
    document.querySelectorAll(".multi-select-dropdown.open").forEach(d => d.classList.remove("open"));
  });
}

// ===== Clear all filters =====
function initClearFilters() {
  document.getElementById("clear-filters").addEventListener("click", () => {
    state.filters = { search: "", pillars: [], sections: [], context: [], status: [] };
    document.getElementById("search-input").value = "";
    refreshMultiSelect("pillar-filter");
    refreshMultiSelect("section-filter");
    ["context-filter", "status-filter"].forEach(id => {
      document.getElementById(id).querySelectorAll("input:checked").forEach(cb => cb.checked = false);
    });
    applyFilters();
  });
}

// ===== Init =====
function init() {
  loadProgress();
  initMultiSelect("pillar-filter", ALL_PILLARS, "pillar");
  initMultiSelect("section-filter", ALL_SECTIONS, "section");
  initCheckboxFilters();
  initSearch();
  initSorting();
  initTableClicks();
  initImportExport();
  initClickOutside();
  initClearFilters();
  document.querySelector('th[data-sort="id"] .sort-arrow').textContent = " \u25B2";
  state.filtered = [...state.topics];
  render();
}

document.addEventListener("DOMContentLoaded", init);

</script>
